<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUNZ 약관 및 방침</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F6F3;
    --surface: #FFFFFF;
    --ink: #1A1F29;
    --ink-2: #4A525E;
    --ink-3: #7B828C;
    --border: #DEE1E0;
    --link: #A81017;
    --shadow: 0 1px 2px rgba(26,31,41,.06), 0 10px 28px rgba(26,31,41,.07);
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI",
            "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Noto Sans Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171C; --surface: #1B1F26; --ink: #ECEEF1; --ink-2: #B3BAC4;
      --ink-3: #838B96; --border: #2B313A; --link: #F0A9A9;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  h1 {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: -.01em;
    margin: 10px 0 12px;
  }
  .lead { color: var(--ink-2); margin: 0 0 32px; }
  .docs { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
  .docs a {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
  }
  .docs a:hover { border-color: var(--link); }
  .docs a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .docs strong { display: block; font-size: 17px; font-weight: 700; }
  .docs span { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-2); }
  .biz {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
    color: var(--ink-2);
  }
  .biz dl {
    margin: 10px 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
  }
  .biz dt { color: var(--ink-3); font-family: var(--mono); font-size: 12.5px; }
  .biz dd { margin: 0; }
  footer { margin-top: 28px; font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="page">
    <span class="eyebrow">RUNZ</span>
    <h1>약관 및 방침</h1>
    <p class="lead">
      러닝 기록 · 언택트 레이스 서비스 RUNZ의 이용약관과 개인정보처리방침입니다.
    </p>

    <ul class="docs">
      <li>
        <a href="./privacy-policy.html">
          <strong>개인정보처리방침</strong>
          <span>수집하는 정보, 이용 목적, 보관 기간, 위치정보 처리에 관한 사항</span>
        </a>
      </li>
      <li>
        <a href="./terms-of-service.html">
          <strong>이용약관</strong>
          <span>서비스 이용 조건, 안전에 관한 고지, 위치기반서비스에 관한 사항</span>
        </a>
      </li>
    </ul>

    <div class="biz">
      <dl>
        <dt>사업자명</dt><dd>참새상회</dd>
        <dt>대표자</dt><dd>김선경</dd>
        <dt>사업자등록번호</dt><dd>663-46-01278</dd>
        <dt>문의</dt><dd>5618563@naver.com · 0502-1935-8563</dd>
      </dl>
    </div>

    <footer>시행일 2026년 9월 16일</footer>
  </div>
</body>
</html>
